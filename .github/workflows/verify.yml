name: 构建与验收
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build && npm test
        working-directory: web
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - run: npm run test:browser
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-evidence
          path: |
            web/dist
            tests/artifacts
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: openacad-worker:verified
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm --entrypoint python openacad-worker:verified -m pytest -q tests
      - run: docker save openacad-worker:verified | gzip > openacad-worker.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: worker-image
          path: openacad-worker.tar.gz
          retention-days: 7
