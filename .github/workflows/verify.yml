name: 构建与验收
on:
  push:
    branches-ignore: [codex/hangzhou-production]
    paths-ignore: ['docs/**', 'tests/artifacts/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', 'tests/artifacts/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build && npm test
        working-directory: web
      - name: 记录发行源码与版本
        run: node --input-type=commonjs -e 'require("node:fs").writeFileSync("dist/version.json", JSON.stringify({version:require("./package.json").version,revision:process.env.GITHUB_SHA,builtAt:new Date().toISOString()}))'
        working-directory: web
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - run: npm run test:browser
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-evidence
          path: |
            web/dist
            tests/artifacts
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 验证发布失败恢复流程
        run: python3 -m unittest discover -s deploy/tests -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          platforms: linux/amd64
          tags: openacad-worker:verified
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm --entrypoint python openacad-worker:verified -m pytest -q tests
      - name: 记录已验证镜像身份
        run: |
          docker image inspect openacad-worker:verified > worker-image-inspect.json
          printf '%s\n' "$GITHUB_SHA" > WORKER_REVISION
      - uses: actions/upload-artifact@v4
        with:
          name: worker-identity
          path: |
            worker-image-inspect.json
            WORKER_REVISION
          retention-days: 7
      - run: docker save openacad-worker:verified | gzip > openacad-worker.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: worker-image
          path: openacad-worker.tar.gz
          retention-days: 7
