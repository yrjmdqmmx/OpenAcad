name: 构建与验收
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_web:
        description: Run full web regression
        type: boolean
        default: false
      rebuild_worker:
        description: Explicitly verify the worker even without server changes
        type: boolean
        default: false
      archive_worker:
        description: Also upload the worker archive for the legacy manual delta workflow
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: openacad-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      web_checks: ${{ steps.scope.outputs.web_checks }}
      browser_checks: ${{ steps.scope.outputs.browser_checks }}
      backend: ${{ steps.scope.outputs.backend }}
      plan: ${{ steps.scope.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release classification and recovery
        run: |
          python3 -m unittest discover -s deploy/tests -v
          python3 -m unittest discover -s deploy/hangzhou/tests -v
      - id: scope
        run: python3 deploy/plan_release.py
  web:
    needs: plan
    if: needs.plan.outputs.web_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authored glyphs and complete font fallback
        run: |
          python -m pip install -r scripts/font-delivery-requirements.txt
          python scripts/build-critical-webfonts.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium firefox webkit
        if: needs.plan.outputs.browser_checks == 'true'
        working-directory: web
      - name: Restore plan
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: python3 -c 'import os,pathlib;pathlib.Path("release-plan.json").write_text(os.environ["PLAN"])'
      - name: Build and run scoped web checks
        run: python3 deploy/run_web_checks.py
  worker:
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          platforms: linux/amd64
          tags: openacad-worker:verified
          cache-from: type=gha,scope=hangzhou-worker
          cache-to: type=gha,mode=max,scope=hangzhou-worker
      - run: docker run --rm --entrypoint python openacad-worker:verified -m pytest -q tests
      - name: Prepare explicitly requested legacy image archive
        if: github.event_name == 'workflow_dispatch' && inputs.archive_worker
        run: |
          docker image inspect openacad-worker:verified > worker-image-inspect.json
          printf '%s\n' "$GITHUB_SHA" > WORKER_REVISION
          docker save openacad-worker:verified | gzip > openacad-worker.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.archive_worker
        with:
          name: worker-identity
          path: |
            worker-image-inspect.json
            WORKER_REVISION
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.archive_worker
        with:
          name: worker-image
          path: openacad-worker.tar.gz
          retention-days: 7
