server {
    listen 80;
    listen [::]:80;
    server_name openacad.xyz www.openacad.xyz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://openacad.xyz$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.openacad.xyz;
    ssl_certificate /etc/letsencrypt/live/openacad.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openacad.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://openacad.xyz$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name openacad.xyz;
    ssl_certificate /etc/letsencrypt/live/openacad.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openacad.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/openacad/current/web;
    index index.html;
    # Compress public static text only. Auth/task JSON stays uncompressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript image/svg+xml;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:13310;
        proxy_set_header Host openacad.xyz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 330s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location /fonts/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location /account/ { try_files $uri =404; add_header Cache-Control "no-store"; add_header Referrer-Policy "no-referrer" always; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
