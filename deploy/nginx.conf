server {
  listen 80;
  server_name openacad.xyz;
  root /opt/openacad/current/web;
  index index.html;
  client_max_body_size 25m;
  location /.well-known/acme-challenge/ { root /var/www/openacad-acme; }
  location /api/ {
    proxy_pass http://127.0.0.1:13310;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 330s;
    proxy_send_timeout 60s;
    proxy_request_buffering on;
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location /fonts/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
